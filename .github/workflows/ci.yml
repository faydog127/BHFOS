name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: command-center
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.1
          cache: npm
          cache-dependency-path: command-center/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  identity_contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: command-center
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.1
          cache: npm
          cache-dependency-path: command-center/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Identity relationship source guards
        run: npm run guard:identity

      - name: Identity helper contract tests
        run: npm run test:identity-helpers

  supabase_oauth_helper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: command-center
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.1
          cache: npm
          cache-dependency-path: command-center/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Supabase OAuth helper self-tests
        run: npm run test:supabase-oauth-helper

  founder_run_readiness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: command-center
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.1
          cache: npm
          cache-dependency-path: command-center/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Founder run readiness self-tests
        run: npm run test:founder-run-readiness

  build:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: command-center
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.1
          cache: npm
          cache-dependency-path: command-center/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:local
