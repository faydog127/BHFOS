name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: command-center
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.1
          cache: npm
          cache-dependency-path: command-center/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  identity_contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: command-center
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.1
          cache: npm
          cache-dependency-path: command-center/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Identity relationship source guards
        run: npm run guard:identity

      - name: Identity helper contract tests
        run: npm run test:identity-helpers

  supabase_oauth_helper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: command-center
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.1
          cache: npm
          cache-dependency-path: command-center/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Supabase OAuth helper self-tests
        run: npm run test:supabase-oauth-helper

      - name: Supabase OAuth tunnel self-tests
        run: npm run test:supabase-oauth-tunnel

      - name: Supabase OAuth launcher preflight self-tests
        run: npm run test:supabase-oauth-launcher-preflight

  founder_run_readiness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: command-center
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.1
          cache: npm
          cache-dependency-path: command-center/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Founder run readiness self-tests
        run: npm run test:founder-run-readiness

  control_plane_lane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: command-center
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.1
          cache: npm
          cache-dependency-path: command-center/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch origin/main for lane activation checks
        run: git fetch origin main

      - name: Control-plane lane activation self-tests
        run: npm run test:control-plane-lane

  finance_unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: command-center
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.1
          cache: npm
          cache-dependency-path: command-center/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Finance planning unit tests
        run: npm run test:finance

  finance_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: command-center
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.1
          cache: npm
          cache-dependency-path: command-center/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.119.0

      - name: Install Postgres client and Playwright browser
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          npx playwright install --with-deps chromium

      - name: Start local Supabase
        run: supabase start

      - name: Reset local database from zero
        run: supabase db reset --local --yes

      - name: Finance Playwright gate
        env:
          FINANCE_EVIDENCE_ROOT: ${{ github.workspace }}/finance-e2e-evidence
        run: node tools/finance-release-gate.mjs

      - name: Fail closed when Finance Playwright skipped or passed nothing
        if: always()
        run: node tools/finance-e2e-report-check.mjs

  build:
    runs-on: ubuntu-latest
    needs: [lint, finance_unit, finance_e2e]
    defaults:
      run:
        working-directory: command-center
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.1
          cache: npm
          cache-dependency-path: command-center/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:local

      - name: Reject finance preview harness
        run: |
          test ! -e finance-preview.html
          test ! -e src/financePreviewMain.jsx
          if find dist \( -iname '*finance-preview*' -o -iname '*financePreview*' \) | grep -q .; then
            echo 'finance preview artifact in dist'
            exit 1
          fi
