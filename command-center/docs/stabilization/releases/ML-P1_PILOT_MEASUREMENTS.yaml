# ML-P1 Reduced Assurance Pilot — Measurements
# Slice 2 and Slice 3 only. Simple durable file — not an analytics platform.
# Update at slice closeout (and optionally at merge packet).
# Formal evaluation: REDUCED_AI_DEVELOPMENT_ASSURANCE_PILOT.md §11 + ML-P1_PILOT_CLOSEOUT.md

pilot_id: REDUCED_AI_DEVELOPMENT_ASSURANCE
governance_doc: command-center/docs/governance/REDUCED_AI_DEVELOPMENT_ASSURANCE_PILOT.md
closeout_doc: command-center/docs/stabilization/releases/ML-P1_PILOT_CLOSEOUT.md
slices: [ML-P1-S2, ML-P1-S3]
status: active

# Judge by: delivery predictability, Founder interruptions, remediation cycles,
# escaped defects, executed evidence quality, governance burden.
# Do NOT judge by: doc count, review count, test count, process-step count.

measurements:
  - id: M1
    name: Founder interruptions and approval requests
    unit: count
  - id: M2
    name: Elapsed time from slice authorization to reviewed PR
    unit: hours
  - id: M3
    name: Number of remediation rounds
    unit: count
  - id: M4
    name: Defects caught before merge versus after merge
    unit: count_pair # before / after
  - id: M5
    name: Governance time as percentage of total slice effort
    unit: percent

